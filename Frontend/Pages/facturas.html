<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Facturación</title>
    <link rel="stylesheet" href="../CSS/styles.css">
</head>
<body>

<div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <img src="../images/MdiPaw.png" class="logo-img" alt="logo">
            <h2>VetClinic</h2>
        </div>
        <ul>
            <li><a href="../index.html"><img src="../images/MdiDoctor.png" class="sidebar-icon" alt="Panel"> Panel</a></li>
            <li><a href="clientes.html"><img src="../images/MdiAccount.png" class="sidebar-icon" alt="Clientes"> Clientes</a></li>
            <li><a href="mascotas.html"><img src="../images/MdiPaw.png" class="sidebar-icon" alt="Mascotas"> Mascotas</a></li>
            <li><a href="citas.html"><img src="../images/MdiCalendarHeart.png" class="sidebar-icon" alt="Citas"> Citas</a></li>
            <li><a href="facturas.html" class="active"><img src="../images/MdiFileDocument.png" class="sidebar-icon" alt="Facturación"> Facturación</a></li>
        </ul>
    </aside>

    <!-- CONTENIDO -->
    <main class="main-content">

        <div class="header">
            <h1>Facturación</h1>
            <button id="btnNuevo">+ Nueva Factura</button>
        </div>

        <!-- FORMULARIO (oculto) -->
        <div id="formContainer" class="hidden">
            <form id="formFactura">
                <div class="input-group">
                    <input type="text" id="cliente" placeholder="DNI del Cliente">
                    <input type="number" id="monto" placeholder="Monto Total (€)">
                </div>
                <div class="input-group">
                    <input type="text" id="descripcion" placeholder="Descripción de los servicios" style="flex: 2;">
                </div>
                <button type="submit">Generar Factura</button>
            </form>
        </div>

        <!-- LISTA -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Cliente</th>
                        <th>Descripción</th>
                        <th>Monto</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaFacturas">
                    <tr>
                        <td>12345678A</td>
                        <td>Revisión general y desparasitación</td>
                        <td>€45.00</td>
                        <td><span class="badge success">Pagado</span></td>
                        <td><button class="btn-small">Ver</button></td>
                    </tr>
                    <tr>
                        <td>87654321B</td>
                        <td>Vacunación anual</td>
                        <td>€60.00</td>
                        <td><span class="badge warning">Pendiente</span></td>
                        <td><button class="btn-small">Pagar</button></td>
                    </tr>
                </tbody>
            </table>
        </div>

    </main>

</div>
<script src="../JS/facturas.js"></script>
</body>
</html>
