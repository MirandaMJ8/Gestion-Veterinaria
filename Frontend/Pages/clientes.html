<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Clientes</title>
    <link rel="stylesheet" href="../CSS/styles.css">
</head>
<body>

<div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <img src="../images/MdiPaw.png" class="logo-img" alt="logo">
            <h2>VetClinic</h2>
        </div>
        <ul>
            <li><a href="../index.html"><img src="../images/MdiDoctor.png" class="sidebar-icon" alt="Panel"> Panel</a></li>
            <li><a href="clientes.html" class="active"><img src="../images/MdiAccount.png" class="sidebar-icon" alt="Clientes"> Clientes</a></li>
            <li><a href="mascotas.html"><img src="../images/MdiPaw.png" class="sidebar-icon" alt="Mascotas"> Mascotas</a></li>
            <li><a href="citas.html"><img src="../images/MdiCalendarHeart.png" class="sidebar-icon" alt="Citas"> Citas</a></li>
            <li><a href="facturas.html"><img src="../images/MdiFileDocument.png" class="sidebar-icon" alt="Facturación"> Facturación</a></li>
        </ul>
    </aside>

    <!-- CONTENIDO -->
    <main class="main-content">

        <div class="header">
            <h1>Gestión de Clientes</h1>
            <button id="btnNuevo">+ Nuevo Cliente</button>
        </div>

        <!-- FORMULARIO (oculto) -->
        <div id="formContainer" class="hidden">
            <form id="formCliente">
                <div class="input-group">
                    <input type="text" id="dni" placeholder="DNI">
                    <input type="text" id="nombre" placeholder="Nombre">
                </div>
                <div class="input-group">
                    <input type="text" id="apellido" placeholder="Apellido">
                </div>
                <button type="submit">Guardar</button>
            </form>
        </div>

        <!-- LISTA -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>DNI</th>
                        <th>Cliente</th>
                        <th>Contacto</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaClientes">
                    <tr>
                        <td>12345678A</td>
                        <td>Juan Pérez</td>
                        <td>juan@example.com</td>
                        <td><button class="btn-small">Editar</button></td>
                    </tr>
                    <tr>
                        <td>87654321B</td>
                        <td>Ana García</td>
                        <td>ana@example.com</td>
                        <td><button class="btn-small">Editar</button></td>
                    </tr>
                </tbody>
            </table>
        </div>

    </main>

</div>
<script src="../js/clientes.js"></script>
</body>
</html>
