<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mascotas</title>
    <link rel="stylesheet" href="../CSS/styles.css">
</head>
<body>

<div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <span class="logo-icon">🐾</span>
            <h2>VetClinic</h2>
        </div>
        <ul>
            <li><a href="../index.html">Panel</a></li>
            <li><a href="clientes.html">Clientes</a></li>
            <li><a href="mascotas.html" class="active">Mascotas</a></li>
            <li><a href="citas.html">Citas</a></li>
            <li><a href="facturas.html">Facturación</a></li>
        </ul>
    </aside>

    <!-- CONTENIDO -->
    <main class="main-content">

        <div class="header">
            <h1>Gestión de Mascotas</h1>
            <button id="btnNuevo">+ Nueva Mascota</button>
        </div>

        <!-- FORMULARIO (oculto) -->
        <div id="formContainer" class="hidden">
            <form id="formMascota">
                <div class="input-group">
                    <input type="text" id="nombreMascota" placeholder="Nombre">
                    <input type="text" id="especie" placeholder="Especie (Ej: Perro, Gato)">
                </div>
                <div class="input-group">
                    <input type="text" id="raza" placeholder="Raza">
                    <input type="text" id="dueno" placeholder="DNI del Dueño">
                </div>
                <button type="submit">Guardar</button>
            </form>
        </div>

        <!-- LISTA -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Especie/Raza</th>
                        <th>Dueño</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaMascotas">
                    <tr>
                        <td>Luna</td>
                        <td>Perro / Labrador</td>
                        <td>12345678A</td>
                        <td><button class="btn-small">Editar</button></td>
                    </tr>
                    <tr>
                        <td>Milo</td>
                        <td>Gato / Siamés</td>
                        <td>87654321B</td>
                        <td><button class="btn-small">Editar</button></td>
                    </tr>
                </tbody>
            </table>
        </div>

    </main>

</div>
<script src="../JS/mascotas.js"></script>
</body>
</html>
