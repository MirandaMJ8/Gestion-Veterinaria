<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Citas</title>
    <link rel="stylesheet" href="../CSS/styles.css">
</head>
<body>

<div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <span class="logo-icon">🐾</span>
            <h2>VetClinic</h2>
        </div>
        <ul>
            <li><a href="../index.html">Panel</a></li>
            <li><a href="clientes.html">Clientes</a></li>
            <li><a href="mascotas.html">Mascotas</a></li>
            <li><a href="citas.html" class="active">Citas</a></li>
            <li><a href="facturas.html">Facturación</a></li>
        </ul>
    </aside>

    <!-- CONTENIDO -->
    <main class="main-content">

        <div class="header">
            <h1>Gestión de Citas</h1>
            <button id="btnNuevo">+ Nueva Cita</button>
        </div>

        <!-- FORMULARIO (oculto) -->
        <div id="formContainer" class="hidden">
            <form id="formCita">
                <div class="input-group">
                    <input type="date" id="fecha">
                    <input type="time" id="hora">
                </div>
                <div class="input-group">
                    <input type="text" id="mascota" placeholder="Nombre de Mascota">
                    <input type="text" id="motivo" placeholder="Motivo de la Cita">
                </div>
                <button type="submit">Guardar</button>
            </form>
        </div>

        <!-- LISTA -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Fecha y Hora</th>
                        <th>Mascota</th>
                        <th>Motivo</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaCitas">
                    <tr>
                        <td>Hoy, 10:00</td>
                        <td>Luna (Perro)</td>
                        <td>Revisión general</td>
                        <td><button class="btn-small">Editar</button></td>
                    </tr>
                    <tr>
                        <td>Hoy, 11:30</td>
                        <td>Milo (Gato)</td>
                        <td>Vacunación</td>
                        <td><button class="btn-small">Editar</button></td>
                    </tr>
                </tbody>
            </table>
        </div>

    </main>

</div>
<script src="../JS/citas.js"></script>
</body>
</html>
