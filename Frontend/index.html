<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Veterinaria</title>
    <link rel="stylesheet" href="CSS/styles.css">
</head>

<body>

    <div class="layout">

        <aside class="sidebar">
            <h2>VetClinic</h2>
            <ul>
                <li><a href="#">Panel</a></li>
                <li><a href="pages/clientes.html">Clientes</a></li>
                <li><a href="pages/mascotas.html">Mascotas</a></li>
                <li><a href="pages/citas.html">Citas</a></li>
                <li><a href="pages/facturas.html">Facturación</a></li>
            </ul>
        </aside>

        <main class="main-content">

            <!-- TOP BAR -->
            <div class="topbar">
                <input type="text" placeholder="Buscar pacientes, clientes...">
            </div>

            <!-- TÍTULO -->
            <h1>Panel de Control</h1>
            <p class="subtitle">Resumen de actividad de la clínica</p>

            <!-- CARDS -->
            <div class="cards">
                <div class="card">
                    <p>Total Clientes</p>
                    <h2>2</h2>
                </div>

                <div class="card">
                    <p>Pacientes</p>
                    <h2>3</h2>
                </div>

                <div class="card">
                    <p>Citas Hoy</p>
                    <h2>2</h2>
                </div>

                <div class="card">
                    <p>Veterinarios</p>
                    <h2>2</h2>
                </div>
            </div>

            <!-- CITAS -->
            <div class="citas-box">
                <h3>Citas para Hoy</h3>

                <div class="cita">
                    <span class="hora">10:00</span>
                    <div>
                        <strong>Luna (Perro)</strong>
                        <p>Revisión general</p>
                    </div>
                </div>

                <div class="cita">
                    <span class="hora">11:30</span>
                    <div>
                        <strong>Milo (Gato)</strong>
                        <p>Vacunación</p>
                    </div>
                </div>
            </div>

        </main>

    </div>

</body>

</html>
