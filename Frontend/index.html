<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Veterinaria</title>
    <link rel="stylesheet" href="CSS/styles.css">
</head>

<body>

    <div class="layout">

        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="images/MdiPaw.png" class="logo-img" alt="logo">
                <h2>VetClinic</h2>
            </div>
            <ul>
                <li><a href="#" class="active"><img src="images/MdiDoctor.png" class="sidebar-icon" alt="Panel"> Panel</a></li>
                <li><a href="pages/clientes.html"><img src="images/MdiAccount.png" class="sidebar-icon" alt="Clientes"> Clientes</a></li>
                <li><a href="pages/mascotas.html"><img src="images/MdiPaw.png" class="sidebar-icon" alt="Mascotas"> Mascotas</a></li>
                <li><a href="pages/citas.html"><img src="images/MdiCalendarHeart.png" class="sidebar-icon" alt="Citas"> Citas</a></li>
                <li><a href="pages/facturas.html"><img src="images/MdiFileDocument.png" class="sidebar-icon" alt="Facturación"> Facturación</a></li>
            </ul>
        </aside>

        <main class="main-content">

            <!-- TOP BAR -->
            <div class="topbar">
                <input type="text" placeholder="Buscar pacientes, clientes...">
            </div>

            <!-- TÍTULO -->
            <h1>Panel de Control</h1>
            <p class="subtitle">Resumen de actividad de la clínica</p>

            <!-- CARDS -->
            <div class="cards">
                <div class="card">
                    <div class="card-icon-wrapper icon-blue">
                        <img src="images/MdiAccount.png" alt="Clientes">
                    </div>
                    <div class="card-info">
                        <p>Total Clientes</p>
                        <h2>2</h2>
                    </div>
                </div>

                <div class="card">
                    <div class="card-icon-wrapper icon-green">
                        <img src="images/MdiPaw.png" alt="Pacientes">
                    </div>
                    <div class="card-info">
                        <p>Pacientes</p>
                        <h2>3</h2>
                    </div>
                </div>

                <div class="card">
                    <div class="card-icon-wrapper icon-purple">
                        <img src="images/MdiCalendarHeart.png" alt="Citas">
                    </div>
                    <div class="card-info">
                        <p>Citas Hoy</p>
                        <h2>2</h2>
                    </div>
                </div>

                <div class="card">
                    <div class="card-icon-wrapper icon-yellow">
                        <img src="images/MdiDoctor.png" alt="Veterinarios">
                    </div>
                    <div class="card-info">
                        <p>Veterinarios</p>
                        <h2>2</h2>
                    </div>
                </div>
            </div>

            <!-- CITAS -->
            <div class="citas-box">
                <h3>Citas para Hoy</h3>

                <div class="cita">
                    <span class="hora">10:00</span>
                    <div>
                        <strong>Luna (Perro)</strong>
                        <p>Revisión general</p>
                    </div>
                </div>

                <div class="cita">
                    <span class="hora">11:30</span>
                    <div>
                        <strong>Milo (Gato)</strong>
                        <p>Vacunación</p>
                    </div>
                </div>
            </div>

        </main>

    </div>

</body>

</html>
